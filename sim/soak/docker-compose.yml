name: arcade-soak

# Detached soak stack (ROADMAP M-SIM): same topology as the sim rig, but with
# an accelerated heartbeat (4 Hz) and a chaos driver injecting random
# partitions and kill -9s, forever. `make soak-status` audits the logs for
# reliability violations. Jellyfin is omitted — soak targets the control link.
#
# Until cabd exists (M0), the heartbeat is a supervised placeholder loop in
# the cabinet container; the harness and violation rules are the deliverable.

services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: soak-toxiproxy
    networks: [cabnet, srvnet]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: ../../server
    container_name: soak-server
    networks: [srvnet]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  cabinet:
    build: ../cabinet
    container_name: soak-cabinet
    entrypoint: ["/bin/sh", "/soak-bin/cabinet-soak.sh"]
    networks: [cabnet]
    environment:
      SERVER_WS_URL: ws://toxiproxy:8666/cab
      HEARTBEAT_SECONDS: "0.25"
      CABD_BACKOFF_CAP: "2"
    volumes:
      - ./bin:/soak-bin:ro
      - ./.data:/soak
      - ../../cabinet:/cabinet:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f heartbeat.sh >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  poller:
    image: python:3.12-slim
    container_name: soak-poller
    command: python3 /soak-bin/poller.py
    networks: [srvnet]
    volumes:
      - ./bin:/soak-bin:ro
      - ./.data:/soak
    depends_on:
      server:
        condition: service_healthy

  chaos:
    image: docker:27-cli
    container_name: soak-chaos
    entrypoint: ["/bin/sh", "/soak-bin/chaos.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./bin:/soak-bin:ro
      - ./.data:/soak
    depends_on:
      toxiproxy:
        condition: service_healthy
      cabinet:
        condition: service_started

networks:
  cabnet: {}
  srvnet: {}
