name: arcade-sim

# Simulation rig (ROADMAP M-SIM).
# Topology rule: the cabinet may reach the server ONLY through toxiproxy, so
# network chaos (latency, partitions, bandwidth) is injectable on every path
# the real system would use over the Cloudflare tunnel (ASSUMPTIONS A-6).
#
#   cabnet:  cabinet, toxiproxy
#   srvnet:  server, plex, toxiproxy
#
# Only toxiproxy straddles both networks.

services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    networks: [cabnet, srvnet]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: ../server
    networks: [srvnet]
    environment:
      # MUST be an IP, not the "plex" service name. An unclaimed PMS decides
      # "is this request local?" from the *Host header*, not the source IP:
      # a Host it cannot parse as an IP/localhost is logged as
      #   "Request came in with unrecognized domain / IP 'plex' in header
      #    Host; treating as non-local"
      # and every API route except /identity answers 401. Pinning plex to a
      # static address lets arcaded address it by IP, which is what makes
      # the token-free unclaimed path work. (allowedNetworks does NOT
      # affect this — verified with the pref both set and cleared.)
      PLEX_URL: http://172.31.7.10:32400
    volumes:
      - ../state:/state-seed:ro   # entrypoint seeds a writable git repo from this
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  plex:
    image: plexinc/pms-docker:latest
    networks:
      srvnet:
        ipv4_address: 172.31.7.10   # arcaded must address Plex by IP; see server.PLEX_URL
    environment:
      # Unclaimed server: answers its HTTP API to local clients with no
      # token. A real claimed server sets PLEX_TOKEN on arcaded instead.
      # NB: this pref is NOT what unlocks the API (the Host header is), and
      # PMS rejects 0.0.0.0/0 outright -- "Illegal allowlist entry has
      # too-short prefix" -- so use a real CIDR.
      ALLOWED_NETWORKS: 172.31.7.0/24
      PLEX_UID: "0"
      PLEX_GID: "0"
    volumes:
      - ./.data/plex/config:/config
      - ./.data/plex/transcode:/transcode
      - ./media:/media:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:32400/identity | grep -q machineIdentifier"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  cabinet:
    build: ./cabinet
    init: true            # PID1 must reap zombies (mpv children of killed games)
    networks: [cabnet]
    volumes:
      - ../cabinet:/cabinet:ro
      - ./fakes:/fakes:ro
      - ./scripts:/simscripts:ro
    environment:
      SERVER_WS_URL: ws://toxiproxy:8666/cab
      HEARTBEAT_SECONDS: "0.25"   # ~20x accelerated (ASSUMPTIONS A-7)
      CABD_BACKOFF_CAP: "2"       # fast reconnect assertions in sim
      FRONTEND_BIN: /fakes/pegasus
      RETROARCH_BIN: /fakes/retroarch
      CABD_MEDIA_BASE: http://toxiproxy:8666
      CABD_SAVES_SYNC_SECONDS: "2"   # accelerated (real cabinet: hourly)
      CABD_REBOOT_CMD: "touch /tmp/reboot-requested"   # can't reboot a container
      # no systemd/NetworkManager in a container: recovery paths are proven
      # by their effects, with the real commands set on hardware (A-19)
      LIFELINE_SSH_CMD: "/simscripts/fake-sshd.sh"
      LIFELINE_TRANSPORT_CMD: "touch /tmp/transport-up"
      LIFELINE_NET_RESTART_CMD: "touch /tmp/net-restarted"
    healthcheck:
      # X up AND the full audio stack alive — a dead wireplumber means sets
      # silently no-op, which must fail health, not pass silently
      test: ["CMD", "sh", "-c", "xdpyinfo -display :0 >/dev/null && pgrep -x wireplumber >/dev/null && pgrep -x pipewire-pulse >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

networks:
  cabnet: {}
  srvnet:
    ipam:
      config:
        - subnet: 172.31.7.0/24   # fixed so plex can hold a stable IP (see plex.networks)
