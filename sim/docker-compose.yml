name: arcade-sim

# Simulation rig (ROADMAP M-SIM).
# Topology rule: the cabinet may reach the server ONLY through toxiproxy, so
# network chaos (latency, partitions, bandwidth) is injectable on every path
# the real system would use over the Cloudflare tunnel (ASSUMPTIONS A-6).
#
#   cabnet:  cabinet, toxiproxy
#   srvnet:  server, jellyfin, toxiproxy
#
# Only toxiproxy straddles both networks.

services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    networks: [cabnet, srvnet]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: ../server
    networks: [srvnet]
    volumes:
      - ../state:/state-seed:ro   # entrypoint seeds a writable git repo from this
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  jellyfin:
    image: jellyfin/jellyfin:latest
    networks: [srvnet]
    volumes:
      - ./.data/jellyfin/config:/config
      - ./.data/jellyfin/cache:/cache
      - ./media:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  cabinet:
    build: ./cabinet
    init: true            # PID1 must reap zombies (mpv children of killed games)
    networks: [cabnet]
    volumes:
      - ../cabinet:/cabinet:ro
      - ./fakes:/fakes:ro
      - ./scripts:/simscripts:ro
    environment:
      SERVER_WS_URL: ws://toxiproxy:8666/cab
      HEARTBEAT_SECONDS: "0.25"   # ~20x accelerated (ASSUMPTIONS A-7)
      CABD_BACKOFF_CAP: "2"       # fast reconnect assertions in sim
      FRONTEND_BIN: /fakes/pegasus
      RETROARCH_BIN: /fakes/retroarch
    healthcheck:
      # X up AND the full audio stack alive — a dead wireplumber means sets
      # silently no-op, which must fail health, not pass silently
      test: ["CMD", "sh", "-c", "xdpyinfo -display :0 >/dev/null && pgrep -x wireplumber >/dev/null && pgrep -x pipewire-pulse >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

networks:
  cabnet: {}
  srvnet: {}
