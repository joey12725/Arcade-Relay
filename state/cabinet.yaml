# Cabinet identity + hardware config (spec §4.1). Server-authoritative.
systems: [nes, snes, genesis, arcade, gba, psx]   # docs/assumptions.md A-4 (OQ-3)
display:
  width: 1024      # docs/assumptions.md A-3 (OQ-1)
  height: 768
hotkeys:
  home_combo: "hold:start:2s"
  screensaver_combo: "hold:select:2s"
  lifeline_combo: "hold:start+select:5s"
# Systems with a real libretro core installed launch through REAL RetroArch;
# everything else uses the sim fake. On the cabinet, fill this in per OQ-3.
emulators:
  gb:
    core: /usr/lib/x86_64-linux-gnu/libretro/gambatte_libretro.so
# Rendered verbatim into retroarch.cfg (video/audio drivers differ between
# sim (sdl2/Xvfb) and the real cabinet (gl); network cmds are how cabd
# controls RetroArch, so they are part of the authoritative config).
retroarch:
  video_driver: gl
  audio_driver: pulse
  # Saves land where the backup loop watches (spec: saves synced to server).
  savefile_directory: /saves
  savestate_directory: /saves
  network_cmd_enable: "true"
  network_cmd_port: 55355
  video_fullscreen: "false"
  pause_nonactive: "false"
