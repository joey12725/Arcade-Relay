<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Control</title>
<style>
  :root { --red: #e23b3b; --blue: #2b4fd8; --bg: #10121a; --card: #1a1e2c; --fg: #eef0f8; }
  * { box-sizing: border-box; }
  .thumb { height: 34px; border-radius: 3px; vertical-align: middle;
           margin: 0 6px; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { background: linear-gradient(90deg, var(--red), var(--blue)); padding: 14px 22px;
           font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
         gap: 16px; padding: 16px; max-width: 1300px; margin: auto; }
  .card { background: var(--card); border-radius: 12px; padding: 16px;
          border-top: 4px solid var(--blue); }
  .card.red { border-top-color: var(--red); }
  h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; }
  .pill { display: inline-block; padding: 3px 12px; border-radius: 999px; font-weight: 700; }
  .on  { background: var(--blue); } .off { background: var(--red); }
  button { background: var(--blue); color: #fff; border: 0; border-radius: 8px;
           padding: 8px 14px; margin: 3px; font-weight: 700; cursor: pointer; }
  button.red { background: var(--red); }
  input[type=range] { width: 160px; vertical-align: middle; accent-color: var(--red); }
  label { display: inline-block; min-width: 100px; }
  ul { list-style: none; padding: 0; margin: 0; } li { padding: 4px 0; }
  img#shot { width: 100%; border-radius: 8px; background: #000; min-height: 120px; }
  select, input[type=text] { background: #0d0f16; color: var(--fg); border: 1px solid #333;
           border-radius: 6px; padding: 7px; }
  .row { margin: 6px 0; }
  small { opacity: .65; }
</style>
</head>
<body>
<header>ARCADE CONTROL</header>
<main>
  <div class="card red">
    <h2>Cabinet</h2>
    <div class="row">Status: <span id="online" class="pill off">…</span></div>
    <div class="row">Running: <b id="running">…</b></div>
    <div class="row">Screensaver: <span id="ssState">…</span></div>
    <div class="row">
      <button onclick="api('POST','/games/kill').then(refresh)" class="red">Kill game</button>
      <button onclick="api('POST','/screensaver/on').then(refresh)">Screensaver on</button>
      <button onclick="api('POST','/screensaver/off').then(refresh)" class="red">Off</button>
    </div>
    <img id="shot" alt="cabinet screen">
    <div class="row"><button onclick="shot()">Refresh screenshot</button></div>
  </div>

  <div class="card">
    <h2>Audio</h2>
    <div class="row"><label>Master</label>
      <input type="range" id="master" min="0" max="100"
             onchange="api('POST','/volume/set',{master:+this.value}).then(refresh)">
      <span id="masterVal"></span></div>
    <div id="classes"></div>
  </div>

  <div class="card">
    <h2>Screensaver</h2>
    <div class="row"><label>Brightness</label>
      <input type="range" id="bright" min="0" max="100"
             onchange="api('POST','/screensaver/set',{brightness:+this.value}).then(refresh)">
      <span id="brightVal"></span></div>
    <div class="row"><label>Idle (s)</label>
      <input type="text" id="idle" size="6">
      <button onclick="api('POST','/screensaver/set',{idle_seconds:+document.getElementById('idle').value}).then(refresh)">Set</button></div>
    <h2 style="margin-top:14px">Sources</h2>
    <ul id="sources"></ul>
  </div>

  <div class="card red">
    <h2>Controller remapper</h2>
    <!-- CTL-3 flagship flow: pick scope -> press the physical button (cabd
         relays live evdev events) -> click the logical target. -->
    <div class="row">
      <select id="scope" onchange="showCurrentMap()"></select>
      <button id="captureBtn" onclick="capture()">1. Press a button…</button>
      <b id="captured">—</b>
    </div>
    <div class="row" id="targets"></div>
    <div class="row"><small id="mapStatus">Pick a scope, capture a physical
      button, then click the logical target it should become.</small></div>
    <div class="row">
      <input type="text" id="preset" placeholder="preset name" size="10">
      <button onclick="api('POST','/controls/save-preset',{name:val('preset')}).then(refresh)">Save</button>
      <button onclick="api('POST','/controls/load-preset',{name:val('preset')}).then(refresh)">Load</button>
    </div>
    <div class="row"><small>Presets: <span id="presets"></span></small></div>
    <div class="row"><small>Current map: <span id="curmap"></span></small></div>
  </div>

  <div class="card">
    <h2>Library</h2>
    <div class="row">
      <select id="libSystem" onchange="loadLibrary()"></select>
      <label><input type="checkbox" id="libFavs" onchange="loadLibrary()"> favorites only</label>
    </div>
    <ul id="library"></ul>
  </div>

  <div class="card">
    <h2>ROM queue</h2>
    <div class="row">
      <input type="text" id="romq" placeholder="e.g. metal slug 3" size="18">
      <button onclick="api('POST','/roms/request',{query:val('romq')}).then(refresh)">Request</button>
    </div>
    <ul id="queue"></ul>
  </div>
</main>
<script>
const val = id => document.getElementById(id).value;
async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {'Content-Type': 'application/json'},
                               body: body ? JSON.stringify(body) : undefined});
  return r.ok ? r.json().catch(() => ({})) : Promise.reject(r.status);
}
async function refresh() {
  const st = await api('GET', '/status');
  const on = document.getElementById('online');
  on.textContent = st.online ? 'ONLINE' : 'OFFLINE';
  on.className = 'pill ' + (st.online ? 'on' : 'off');
  document.getElementById('running').textContent = st.cabinet_state.running || 'nothing';
  document.getElementById('ssState').textContent = st.cabinet_state.screensaver ? 'on' : 'off';

  const vol = await api('GET', '/volume');
  document.getElementById('master').value = vol.master ?? 70;
  document.getElementById('masterVal').textContent = (vol.master ?? 70) + '%';
  document.getElementById('classes').innerHTML = Object.entries(vol.classes || {}).map(([c, v]) =>
    `<div class="row"><label>${c}</label>
     <button onclick="api('POST','/volume/set',{class:'${c}',muted:${!v.muted}}).then(refresh)"
             class="${v.muted ? 'red' : ''}">${v.muted ? 'muted' : 'audible'}</button>
     <small>${v.volume}%</small></div>`).join('');

  const ss = await api('GET', '/screensaver');
  document.getElementById('bright').value = ss.brightness;
  document.getElementById('brightVal').textContent = ss.brightness + '%';
  document.getElementById('idle').value = ss.idle_seconds;

  api('GET', '/screensaver/sources').then(srcs => {
    document.getElementById('sources').innerHTML = srcs.map(s =>
      `<li><button class="${s.enabled ? '' : 'red'}"
        onclick="api('POST','/screensaver/set-source',{id:'${s.id}',enabled:${!s.enabled}}).then(refresh)">
        ${s.enabled ? '✓' : '✗'}</button>
       ${s.thumb ? `<img src="${s.thumb}" alt="" class="thumb">` : ''}
       ${s.name} <small>${s.type}</small></li>`).join('');
  }).catch(() => {});

  api('GET', '/controls/presets').then(p => {
    document.getElementById('presets').textContent = p.presets.join(', ') || '(none)';
  });
  const scope = document.getElementById('scope');
  if (!scope.options.length) {
    ['global','system:nes','system:snes','system:genesis','system:arcade',
     'system:gba','system:psx','system:gb'].forEach(s => scope.add(new Option(s, s)));
    renderTargets();
  }
  showCurrentMap();
  loadLibrary();   // every cycle: ROMs delivered while the page is open must appear
  const q = await api('GET', '/roms/status');
  document.getElementById('queue').innerHTML = (q.queue || []).map(e =>
    `<li><b>${e.title}</b> — ${e.status} <small>${e.detail || ''}</small></li>`).join('') || '<li><small>empty</small></li>';
}
// ---- CTL-3 interactive remapper ----
const TARGETS = ['a','b','x','y','l','r','start','select','up','down','left','right'];
let capturedButton = null;

function renderTargets() {
  document.getElementById('targets').innerHTML = TARGETS.map(t =>
    `<button class="tgt" onclick="assign('${t}')">${t}</button>`).join(' ');
}

async function capture() {
  const btn = document.getElementById('captureBtn');
  btn.textContent = 'listening… press it now';
  // live evdev events relayed from cabd (input.monitor RPC)
  const r = await api('POST', '/controls/monitor', {seconds: 3}).catch(() => ({}));
  const down = (r.events || []).map(e => e.split(' ')[0]).filter(Boolean);
  capturedButton = down.length ? down[0] : null;
  document.getElementById('captured').textContent = capturedButton || '(nothing)';
  document.getElementById('mapStatus').textContent = capturedButton
    ? `Captured "${capturedButton}" — now click the logical target.`
    : 'No input seen. Press the physical button while capturing.';
  btn.textContent = '1. Press a button…';
}

async function assign(target) {
  if (!capturedButton) {
    document.getElementById('mapStatus').textContent =
      'Capture a physical button first.';
    return;
  }
  await api('POST', '/controls/map',
            {scope: val('scope'), set: {[capturedButton]: target}});
  document.getElementById('mapStatus').textContent =
    `Mapped ${capturedButton} → ${target} in ${val('scope')} (committed).`;
  capturedButton = null;
  document.getElementById('captured').textContent = '—';
  refresh();
}

async function showCurrentMap() {
  const b = await api('GET', '/state/bundle').catch(() => ({}));
  const scope = val('scope');
  const data = scope === 'global'
    ? (b['controllers/global.yaml'] || {}).buttons
    : (b['controllers/systems/' + scope.split(':')[1] + '.yaml'] || {}).remap;
  document.getElementById('curmap').textContent =
    Object.entries(data || {}).map(([k, v]) => `${k}→${v}`).join('  ') || '(none)';
}

// ---- library page (§6.3): browse, favorite, launch ----
async function loadLibrary() {
  const sysSel = document.getElementById('libSystem');
  const qs = [];
  if (sysSel.value) qs.push('system=' + encodeURIComponent(sysSel.value));
  if (document.getElementById('libFavs').checked) qs.push('favorites=1');
  const r = await api('GET', '/games/list' + (qs.length ? '?' + qs.join('&') : ''))
                  .catch(() => ({games: []}));
  // Rebuild the system list from the FULL library (the filtered response
  // can't name systems it filtered out) whenever the set changes — a new
  // system appearing must not require a page reload.
  const all = sysSel.value || document.getElementById('libFavs').checked
    ? await api('GET', '/games/list').catch(() => ({games: []})) : r;
  const systems = [...new Set(all.games.map(g => g.system))].sort();
  const shown = [...sysSel.options].slice(1).map(o => o.value);
  if (systems.join() !== shown.join()) {
    const keep = sysSel.value;
    sysSel.innerHTML = '';
    sysSel.add(new Option('(all systems)', ''));
    systems.forEach(s => sysSel.add(new Option(s, s)));
    sysSel.value = systems.includes(keep) ? keep : '';
  }
  document.getElementById('library').innerHTML = r.games.map(g =>
    `<li><button onclick="api('POST','/games/launch',
        {system:'${g.system}',path:'${g.path}'}).then(refresh)">▶</button>
     <button class="${g.favorite ? '' : 'red'}"
       onclick="api('POST','/favorites/${g.favorite ? 'remove' : 'add'}',
         {id:'${g.id}'}).then(loadLibrary)">${g.favorite ? '★' : '☆'}</button>
     ${g.id}</li>`).join('') || '<li><small>no games</small></li>';
}
function shot() { document.getElementById('shot').src = '/cab/screenshot?' + Date.now(); }
refresh(); shot(); setInterval(refresh, 5000);
</script>
</body>
</html>
