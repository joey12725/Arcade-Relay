<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCADE CONTROL PLANE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Titan+One&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens
   Y2K control plane. Fonts load from Google but every stack falls back to a
   system face: this server usually sits on a LAN with no egress, and a
   missing webfont must degrade to "chunky sans", not to serif soup. */
:root {
  --hot:#ff2d8f; --blue:#0b3fd1; --lime:#1fa83c; --purp:#7b2dff;
  --red:#ee0a4b; --yel:#e8a800; --aqua:#00a48f; --ink:#1b0b2e;
  --grey:#9d86b3; --greyink:#4a3560;
  --disp:'Titan One', 'Arial Black', Impact, sans-serif;
  --cap:'Bungee', 'Arial Black', Verdana, sans-serif;
  --body:Verdana, Tahoma, Geneva, sans-serif;
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; }
body {
  font-family:var(--body); color:var(--ink); padding-bottom:210px; background:#fff;
  background-image:
    radial-gradient(circle at 12px 12px, rgba(11,63,209,.15) 4px, transparent 5px),
    radial-gradient(circle at 44px 40px, rgba(255,212,0,.35) 5px, transparent 6px);
  background-size:64px 64px;
}
a { color:#c8007a; font-weight:bold; } a:hover { color:var(--blue); }
code { font-family:ui-monospace, Menlo, Consolas, monospace; }
table { border-collapse:collapse; width:100%; }

@keyframes marq   { from{transform:translateX(0)} to{transform:translateX(-50%)} }
@keyframes blink  { 0%,49%{opacity:1} 50%,100%{opacity:.2} }
@keyframes pulse  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
@keyframes stripe { from{background-position:0 0} to{background-position:40px 0} }
@keyframes bob    { 0%,100%{transform:translateY(0) rotate(-1.5deg)} 50%{transform:translateY(-7px) rotate(1.5deg)} }
@keyframes flyby  { from{transform:translateX(-320px)} to{transform:translateX(105vw)} }
@keyframes sparkfly {
  from { transform:translate(0,0) scale(.35) rotate(0deg); opacity:1 }
  to   { transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(200deg); opacity:0 }
}
/* One class kills every animation. Set from the header toggle, and seeded
   from prefers-reduced-motion at boot. */
body.nomotion *, body.nomotion *::before, body.nomotion *::after {
  animation:none !important; transition:none !important;
}

/* ------------------------------------------------------------------ header */
.top { background:linear-gradient(180deg,#fff,#fff0b8 45%,#ffd400 100%);
       border-bottom:6px solid var(--ink); box-shadow:0 5px 0 rgba(11,63,209,.35); }
.top .bar { max-width:1400px; margin:0 auto; padding:12px 18px 0;
            display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; }
.top .flame { width:74px; height:74px; object-fit:contain; flex-shrink:0; }
.top .myspace { width:168px; height:84px; object-fit:contain; flex-shrink:0;
                animation:bob 4s ease-in-out infinite; }
.wordmark {
  /* fluid so it stays on one line down to a laptop width — the header also
     carries two GIFs and four pills, so a fixed 42px wraps early */
  font-family:var(--disp); font-size:clamp(20px, 2.1vw, 42px);
  line-height:1; white-space:nowrap; color:var(--blue);
  background:linear-gradient(#fff,#eaf0ff 38%,var(--blue) 50%,var(--hot) 62%,#fff);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(3px 3px 0 var(--ink)) drop-shadow(0 5px 4px rgba(0,0,0,.25));
}
.sub { font-size:11px; font-weight:bold; letter-spacing:.18em;
       text-transform:uppercase; color:var(--blue); margin-top:4px; }
.pills { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-bottom:10px; }
.tabs { max-width:1400px; margin:0 auto; padding:10px 18px 0;
        display:flex; gap:5px; flex-wrap:wrap; align-items:flex-end; }
.tab { font-family:var(--cap); font-size:12px; letter-spacing:.03em;
       padding:9px 14px 11px; border:4px solid var(--ink); border-bottom:none;
       border-top-left-radius:14px; border-top-right-radius:14px;
       background:linear-gradient(180deg,#fff,#ffd0e8 55%,#ff8fc4);
       color:#8a0052; cursor:pointer; text-shadow:0 1px 0 rgba(255,255,255,.8);
       box-shadow:none; transition:all 170ms cubic-bezier(.34,1.56,.64,1); }
.tab.on { padding:12px 16px 14px; transform:translateY(4px); color:#5a3200;
          background:linear-gradient(180deg,#fff,#ffd400 50%,#ffb300); }
.rainbow { height:8px; background:repeating-linear-gradient(90deg,
  var(--hot) 0 16px,#ffd400 16px 32px,var(--blue) 32px 48px,#35c04a 48px 64px); }
.marquee-bar { background:linear-gradient(180deg,#2a0b3f,#10021d); color:#ffd400;
  font-size:13px; font-weight:bold; letter-spacing:.08em; overflow:hidden;
  white-space:nowrap; padding:7px 0; border-bottom:4px solid #ffd400; }
.marquee-bar > div { display:inline-flex; white-space:nowrap; animation:marq 30s linear infinite; }
.marquee-bar span { padding-right:70px; }

main { max-width:1400px; margin:0 auto; padding:18px; }

/* ------------------------------------------------------------------ panels */
.panel { border:5px solid var(--blue); border-radius:12px; background:#fff;
  box-shadow:5px 5px 0 rgba(27,11,46,.22), inset 0 0 0 2px #fff; overflow:hidden; }
.panel > .cap { font-family:var(--cap); font-size:13px; letter-spacing:.07em;
  color:#fff; padding:9px 12px; text-shadow:0 2px 0 rgba(0,0,0,.4);
  border-bottom:4px solid rgba(27,11,46,.35);
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%), var(--blue); }
.panel > .body { padding:12px 14px; }
.p-hot{border-color:var(--hot)}    .p-hot   > .cap{background-color:var(--hot)}
.p-blue{border-color:var(--blue)}  .p-blue  > .cap{background-color:var(--blue)}
.p-lime{border-color:var(--lime)}  .p-lime  > .cap{background-color:var(--lime)}
.p-purp{border-color:var(--purp)}  .p-purp  > .cap{background-color:var(--purp)}
.p-red{border-color:var(--red)}    .p-red   > .cap{background-color:var(--red)}
.p-yel{border-color:var(--yel)}    .p-yel   > .cap{background-color:var(--yel)}
.p-aqua{border-color:var(--aqua)}  .p-aqua  > .cap{background-color:var(--aqua)}

.grid { display:grid; gap:14px; align-items:start; }
.col  { display:flex; flex-direction:column; gap:14px; }
.g-dash   { grid-template-columns:2.1fr 1.15fr; }
.g-half   { grid-template-columns:1fr 1fr; }
.g-health { grid-template-columns:1.2fr 1fr; }
.g-remap  { grid-template-columns:1fr 1.3fr; }
@media (max-width:1100px) { .grid { grid-template-columns:1fr !important; } }

/* ----------------------------------------------------------------- buttons */
button { font-family:var(--cap); font-size:13px; letter-spacing:.04em; color:#fff;
  padding:10px 15px; border-radius:10px; border:3px solid #fff; cursor:pointer;
  text-shadow:0 2px 0 rgba(0,0,0,.4); white-space:nowrap;
  transition:transform 120ms cubic-bezier(.34,1.6,.64,1);
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.05) 46%,rgba(0,0,0,.2)),
             linear-gradient(180deg,#5c8bff,var(--blue));
  box-shadow:0 4px 0 #062a8a, 0 0 0 2px #062a8a; }
button:hover:not(:disabled) { transform:translateY(-2px); }
button:active:not(:disabled) { transform:translateY(2px); }
button:disabled { opacity:.45; cursor:not-allowed; }
button.sm { font-size:11px; padding:7px 10px; }
button.xs { font-size:9.5px; padding:5px 7px; }
button.grey { background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.05) 46%,rgba(0,0,0,.2)),
              linear-gradient(180deg,#e6d8ee,var(--grey)); box-shadow:0 4px 0 var(--greyink), 0 0 0 2px var(--greyink); }
button.danger { background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.05) 46%,rgba(0,0,0,.2)),
                linear-gradient(180deg,#ff8fb4,var(--red)); box-shadow:0 4px 0 #8a0035, 0 0 0 2px #8a0035; }
button.lime { background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.05) 46%,rgba(0,0,0,.2)),
              linear-gradient(180deg,#8fe36a,var(--lime)); box-shadow:0 4px 0 #065c22, 0 0 0 2px #065c22; }
button.gold { color:#4a3300; background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.05) 46%,rgba(0,0,0,.2)),
              linear-gradient(180deg,#ffe07a,var(--yel)); box-shadow:0 4px 0 #8a6400, 0 0 0 2px #8a6400; }
button.mini { font-family:var(--body); font-size:10px; font-weight:bold; padding:7px 10px;
  border-radius:8px; border:3px solid var(--ink); color:#8a0052; text-shadow:none;
  background:linear-gradient(#fff,#ffd0e8); box-shadow:none; }

/* ------------------------------------------------------------------ inputs */
input[type=text], input[type=number], input[type=search], select {
  font-family:var(--body); font-size:12px; font-weight:bold; padding:6px 8px;
  border:3px solid var(--ink); border-radius:5px; background:#fff; color:var(--ink); }
input:disabled, select:disabled { opacity:.5; }
input[type=range] { -webkit-appearance:none; appearance:none; height:24px; background:transparent; }
input[type=range]::-webkit-slider-runnable-track { height:16px; border-radius:9px;
  border:3px solid var(--ink); background:linear-gradient(180deg,#fff,#ffd9ee 55%,#ff8fc4);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.3); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px;
  margin-top:-8px; border-radius:50%; border:3px solid #fff;
  background:radial-gradient(circle at 34% 28%,#fffbe0,#ffd400 50%,#e07800);
  box-shadow:0 0 0 3px var(--ink), 0 3px 5px rgba(0,0,0,.4); cursor:pointer; }
input[type=range]::-moz-range-track { height:16px; border-radius:9px;
  border:3px solid var(--ink); background:linear-gradient(180deg,#fff,#ffd9ee 55%,#ff8fc4); }
input[type=range]::-moz-range-thumb { width:22px; height:22px; border-radius:50%;
  border:3px solid #fff; background:radial-gradient(circle at 34% 28%,#fffbe0,#ffd400 50%,#e07800);
  box-shadow:0 0 0 3px var(--ink); cursor:pointer; }
label.field { font-size:11px; font-weight:bold; display:inline-block; }
label.field > select, label.field > input { margin-top:4px; display:block; }

/* -------------------------------------------------------------------- bits */
.badge { font-family:var(--body); font-size:10px; font-weight:bold; letter-spacing:.06em;
  padding:3px 8px; border-radius:20px; color:#fff; border:2px solid #fff;
  box-shadow:0 0 0 2px var(--ink); white-space:nowrap; display:inline-block; }
.pill { font-size:11px; padding:6px 10px; }
.chip { font-size:10.5px; font-weight:bold; letter-spacing:.06em; padding:4px 9px;
  border-radius:20px; background:#fff0f8; border:3px solid var(--hot); color:#8a0052; }
.state { font-family:var(--body); font-size:11px; font-weight:bold; padding:6px 11px;
  border-radius:20px; white-space:nowrap; display:inline-block;
  border:3px solid #6a4a8a; background:#f6f0ff; color:#3a1a6a; }
.state.ok   { border-color:#0a7a2f; background:#e3ffe8; color:#065c22; }
.state.err  { border-color:#c1004a; background:#ffe4ee; color:#8a0035; }
.state.pend { border-color:#b07800; background:#fff8db; color:#6b4700; }
th { font-family:var(--body); font-size:10px; font-weight:bold; letter-spacing:.1em;
  text-align:left; padding:7px 8px; color:#fff; border:1px solid var(--ink);
  background:linear-gradient(180deg,#2f6bff,#0b2fa8); white-space:nowrap; }
td { padding:6px 8px; border-bottom:2px solid #ffe08a; border-right:1px solid #f2e6c8;
  font-size:12px; vertical-align:middle; }
tbody tr:nth-child(even) { background:#fffbe8; }
.meter { height:26px; border:4px solid var(--ink); border-radius:8px; background:#fff;
  overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.25); }
.meter > i { display:block; height:100%; transition:width 300ms ease;
  background:repeating-linear-gradient(90deg,#5c8bff 0 10px,var(--blue) 10px 20px);
  animation:stripe 1.2s linear infinite; }
.meter > i.hot { background:repeating-linear-gradient(90deg,#ff9ec0 0 10px,var(--red) 10px 20px); }
.kv { display:flex; justify-content:space-between; gap:10px; font-size:12px;
  font-weight:bold; border-bottom:2px dotted #e0cff0; padding:5px 0; }
.stat { font-size:9px; font-weight:bold; letter-spacing:.12em; text-align:center;
  padding:8px 12px; border-radius:12px; border:4px solid var(--blue);
  background:#eef3ff; color:#062a8a; }
.stat b { font-size:26px; font-family:var(--cap); display:block; }
.stat.pink { border-color:var(--hot); background:#fff0f8; color:#8a0052; }
.note { font-size:11px; font-weight:bold; line-height:1.6; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.rowe { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.art { border-radius:6px; border:3px solid #fff; box-shadow:0 0 0 2px var(--ink);
  object-fit:cover; background:linear-gradient(150deg,var(--purp),#7cff5a); }
.art.ph { display:grid; place-items:center; font-family:ui-monospace,monospace;
  font-size:9px; color:#fff; text-align:center; padding:4px; overflow:hidden; }
.thumb { width:40px; height:30px; object-fit:cover; border-radius:5px;
  border:2px solid #fff; box-shadow:0 0 0 2px var(--ink); flex-shrink:0; }

/* A control the server genuinely cannot perform yet: stated plainly with the
   reason, rather than shipped as a button that silently does nothing. */
.gap { border:3px dashed var(--yel); background:#fffbe4; border-radius:9px;
  padding:8px 10px; font-size:11px; font-weight:bold; line-height:1.55; color:#6b4700;
  margin-top:12px; }
.gap b { font-family:var(--cap); font-size:11px; color:#8a6400; }

/* ---------------------------------------------------------------- overlays */
.shrine { position:fixed; bottom:10px; z-index:80; width:176px; border-radius:6px;
  background:var(--ink); overflow:hidden; }
.shrine.l { left:10px; border:5px ridge var(--hot); box-shadow:5px 5px 0 rgba(27,11,46,.35); }
.shrine.r { right:10px; border:5px ridge var(--blue); box-shadow:-5px 5px 0 rgba(27,11,46,.35); }
.shrine .t { font-family:var(--cap); font-size:10px; padding:3px 6px; letter-spacing:.06em; }
.shrine.l .t { color:var(--ink); background:linear-gradient(180deg,#fff,#ffd400); }
.shrine.r .t { color:#fff; background:linear-gradient(180deg,#5c8bff,var(--blue)); }
.shrine img { display:block; width:100%; }
.shrine .f { font-size:9px; font-weight:bold; color:#ffd400; background:var(--ink);
  padding:3px 6px; text-align:center; }
@media (max-width:1500px) { .shrine { display:none; } }
#toasts { position:fixed; right:196px; bottom:16px; z-index:95;
  display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.toast { font-size:12px; font-weight:bold; padding:10px 14px; border-radius:10px;
  border:4px solid #fff; box-shadow:0 6px 0 rgba(27,11,46,.35); color:#fff;
  max-width:420px; background:var(--blue); }
.toast.ok { background:var(--lime); } .toast.err { background:var(--red); }
.toast.warn { background:var(--yel); color:#3a2400; }
#modal { position:fixed; inset:0; z-index:90; background:rgba(27,11,46,.6);
  display:grid; place-items:center; padding:20px; }
#modal .box { width:480px; max-width:100%; border:6px solid var(--red); border-radius:14px;
  background:#fff; box-shadow:0 18px 40px rgba(0,0,0,.45); overflow:hidden; }
#modal .hdr { font-family:var(--cap); font-size:13px; color:#fff; padding:9px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%), var(--red);
  text-shadow:0 2px 0 rgba(0,0,0,.4); border-bottom:4px solid rgba(27,11,46,.35); }
#modal .txt { padding:16px; font-size:13px; font-weight:bold; line-height:1.6; }
#modal .act { padding:0 16px 16px; display:flex; gap:8px; justify-content:flex-end; }
#sparks { position:fixed; inset:0; z-index:99; pointer-events:none; overflow:hidden; }
#sparks i { position:fixed; display:block; background-size:contain;
  background-repeat:no-repeat; animation:sparkfly 700ms ease-out forwards; }
#party { position:fixed; inset:0; z-index:97; pointer-events:none; overflow:hidden; }
#party .nyan { position:fixed; top:42%; left:0; width:300px; height:150px;
  background-size:contain; background-repeat:no-repeat; animation:flyby 3.2s linear infinite; }
#party .ban { position:fixed; left:0; right:0; top:30%; text-align:center;
  font-family:var(--disp); font-size:52px; color:#ffd400;
  text-shadow:5px 5px 0 var(--hot),0 0 30px rgba(0,0,0,.4); animation:pulse .6s ease-in-out infinite; }
.hide { display:none !important; }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <img class="flame" src="/assets/deco/flame.gif" alt="">
    <div style="flex:1; min-width:280px;">

<main>
  <div id="offlineBanner" class="hide" style="margin-bottom:14px; border:5px solid var(--red);
       background:#fff0f5; padding:10px 14px; border-radius:10px; display:flex; gap:10px;
       align-items:center; flex-wrap:wrap; box-shadow:4px 4px 0 rgba(27,11,46,.2);">

<script>
"use strict";
/* =====================================================================
   ARCADE CONTROL PLANE — vanilla ES2020, no build step. arcaded serves
   this file straight off disk (web.FileResponse) and the server image
   has no Node in it, so there is deliberately nothing to compile.
   ===================================================================== */

const TABS = [
  ["dash",   "DASHBOARD"],
  ["audio",  "AUDIO"],
  ["saver",  "SCREENSAVER"],
  ["stream", "STREAMING"],
  ["health", "CABINET HEALTH"],
  ["remap",  "CONTROLLER REMAPPER"],
  ["lib",    "GAME LIBRARY"],
  ["rom",    "ROM QUEUE"],
  ["integ",  "BROADCAST"],
];
const TAB_KEYS = TABS.map(([k]) => k);

const S = {
  page: TAB_KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "dash",
  motion: !matchMedia("(prefers-reduced-motion: reduce)").matches,
  online: false, lastSeen: null, pending: 0,
  ov: null, alerts: [], health: null,
  audio: null, audioDirty: false, audioState: "",
  saver: null, saverDirty: false, saverState: "",
  sources: null, srcLoading: false, srcQuery: "", poolFilter: "",
  stream: null,
  remap: { scope: "global", scopes: ["global"], devices: null, bindings: {},
           combos: [], targets: {}, combo: [], hold: 0,
           presets: [], presetName: "", capture: null, stage: "idle",
           msg: "Press CAPTURE, then a button on the cabinet panel." },
  lib: { sys: "All", q: "", favOnly: false },
  rom: { query: "", system: "" }, romBackend: null,
  integ: null, integDirty: false, integState: "",
  konami: 0,
};

const LOGICAL = ["a", "b", "x", "y", "l", "r", "start", "select",
                 "up", "down", "left", "right"];
const HOLDS = [0, 500, 1000, 2000];

/* --------------------------------------------------------------- plumbing */
async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(path, opt);
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = { raw: text }; }
  if (!r.ok) {
    const msg = (data && (data.error || data.raw)) || r.statusText || ("HTTP " + r.status);
    const err = new Error(String(msg).slice(0, 300));
    err.status = r.status;
    throw err;
  }
  return data;
}

/** Run a mutating call with a pending pill, a toast either way, and a
 *  refresh afterwards. Every write goes through here so a failure is never
 *  silent — a control that appears to do nothing is the single most
 *  confusing failure mode this thing has. Pass okMsg = null to toast
 *  yourself; rejections are re-thrown for callers that care. */
async function op(label, fn, okMsg) {
  S.pending++; paintChrome();
  try {
    const res = await fn();
    if (okMsg !== null) toast(okMsg || ("✔ " + label), "ok");
    return res;
  } catch (e) {
    toast("✖ " + label + ": " + e.message, "err");
    throw e;
  } finally {
    S.pending--;
    await refresh();
  }
}

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 5200);
}

let confirmResolve = null;
function ask(text) {
  document.getElementById("modalText").textContent = text;
  document.getElementById("modal").classList.remove("hide");
  return new Promise((res) => { confirmResolve = res; });
}
function closeModal(v) {

}

document.getElementById("modalYes").onclick = () => closeModal(true);

function sparkle(el, frac) {
  if (!S.motion || !el) return;
  const r = el.getBoundingClientRect();
  const x = r.left + 13 + (r.width - 26) * frac, y = r.top + r.height / 2;
  const host = document.getElementById("sparks");
  for (let i = 0; i < 7; i++) {
    const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 55;
    const sz = 14 + Math.random() * 20;
    const node = document.createElement("i");
    node.style.cssText =
      "left:" + x + "px;top:" + y + "px;width:" + sz + "px;height:" + sz + "px;" +
      "--dx:" + Math.cos(a) * d + "px;--dy:" + (Math.sin(a) * d - 18) + "px;" +
      "background-image:url(/assets/sprites/" +
      (Math.random() > 0.5 ? "sparkle" : "star") + ".png)";

/* ------------------------------------------------------------- templating
   Views build HTML strings and get swapped in wholesale. Two guards make
   that safe: every interpolated value goes through esc(), and focus plus
   caret position are restored after the swap so typing in a filter box
   survives the 3-second background poll. */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function h(strings, ...vals) {
  return strings.reduce((out, s, i) => out + s + (i < vals.length ? vals[i] : ""), "");
}

/* Delegated events: handlers are named via data-act / data-change /
   data-input and resolved here, so re-rendering can never strand a
   listener or leak one. */
const ACTIONS = {};
function delegate(evt, attr) {
  document.addEventListener(evt, (e) => {
    const t = e.target.closest("[data-" + attr + "]");
    if (!t || t.disabled) return;
    const fn = ACTIONS[t.dataset[attr]];
    if (!fn) return;
    if (evt === "click") e.preventDefault();
    fn(t, e);
  });
}
delegate("click", "act");
delegate("change", "change");
delegate("input", "input");

function setView(html) {
  const host = document.getElementById("view");
  const act = document.activeElement;
  const key = act && act.dataset ? act.dataset.k : null;
  const start = act && act.selectionStart, end = act && act.selectionEnd;
  host.innerHTML = html;
  if (!key) return;
  const next = host.querySelector('[data-k="' + CSS.escape(key) + '"]');
  if (!next) return;
  next.focus();
  try { next.setSelectionRange(start, end); } catch (_) { /* not a text field */ }
}

/* ------------------------------------------------------------- formatting */
const pct = (v) => (v == null ? "—" : Math.round(v) + "%");
const dash = (v) => (v == null || v === "" ? "—" : v);
function hms(sec) {
  if (sec == null) return "—";
  const s = Math.max(0, Math.floor(sec));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) +
         ":" + String(s % 60).padStart(2, "0");
}
function relTime(ts) {
  if (!ts) return "";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
/** '/roms/nes/Metroid (USA).nes' -> {system:'nes', file:'Metroid (USA).nes'} */
function splitRom(path) {
  if (!path) return null;
  const parts = String(path).split("/").filter(Boolean);
  const file = parts.pop();
  return { system: parts.pop() || "?", file };
}
const artUrl = (system, file) =>
  "/art/" + encodeURIComponent(system) + "/" + encodeURIComponent(file);

/** Cover art with a graceful placeholder. A 404 is the normal state for a
 *  cold cache (art is fetched lazily), so it must never look like an error. */
function cover(system, file, w, ht) {
  const box = "width:" + w + "px;height:" + ht + "px;";
  if (!system || !file) return h`<div class="art ph" style="${box}">no art</div>`;
  return h`<img class="art" style="${box}" loading="lazy" alt="" src="${esc(artUrl(system, file))}"
    onerror="this.outerHTML='<div class=&quot;art ph&quot; style=&quot;${box}&quot;>no art</div>'">`;
}
function badge(text, color) {
  return h`<span class="badge" style="background:${color}">${esc(text)}</span>`;
}
function panel(cls, cap, body) {
  return h`<div class="panel ${cls}"><div class="cap">${cap}</div><div class="body">${body}</div></div>`;
}
function gapNote(title, html) {
  return h`<div class="gap"><b>${esc(title)}</b><br>${html}</div>`;
}
const off = () => !S.online;

/** Elapsed play time, ticking between heartbeats.
 *  cabd sends both `elapsed_s` (monotonic, authoritative) and `started_at`
 *  (epoch). Using the epoch to interpolate keeps the counter moving at 1 Hz
 *  instead of jumping every heartbeat; it falls back to the reported value
 *  when clocks disagree, which is what monotonic is there for. */
function liveElapsed(cab) {
  if (!cab || !cab.running) return null;
  if (cab.started_at) {
    const wall = Date.now() / 1000 - cab.started_at;
    if (wall >= 0 && (cab.elapsed_s == null || Math.abs(wall - cab.elapsed_s) < 120)) {
      return wall;
    }
  }
  return cab.elapsed_s;
}

/* =========================================================== data loading */
async function refresh() {
  try {
    const ov = await api("GET", "/overview");
    S.ov = ov;
    S.online = !!ov.online;
    if (ov.online) S.lastSeen = Date.now();
    if (S.page !== "health" || !S.health) S.health = ov.health;
    if (!S.audioDirty) S.audio = ov.audio;
    if (!S.saverDirty) S.saver = ov.screensaver;
    S.stream = ov.streaming;
  } catch (_) {
    S.online = false;
  }
  try { S.alerts = (await api("GET", "/alerts?limit=8")).alerts; } catch (_) { /* non-fatal */ }
  paint();
}

/* Tab-scoped loads. Kept off the 3s poll so it never drags a Plex library
   listing or an evdev enumeration along with it. */
const LOADED = {};
async function loadTab(page) {
  try {
    if (page === "saver" && !S.sources && !S.srcLoading) {
      S.srcLoading = true; paint();
      try { S.sources = await api("GET", "/screensaver/sources"); }
      finally { S.srcLoading = false; }
    }
    if (page === "health") S.health = await api("GET", "/cab/health");
    if (page === "integ") S.integ = await api("GET", "/integrations");
    if (page === "rom" && !S.romBackend) {
      S.romBackend = await api("GET", "/roms/backend").catch(() => ({}));
    }
    if (page === "remap" && !LOADED.remap) {
      LOADED.remap = true;
      const [scopes, presets] = await Promise.all([
        api("GET", "/controls/scopes").catch(() => ({ scopes: ["global"] })),
        api("GET", "/controls/presets").catch(() => ({ presets: [] })),
      ]);
      S.remap.scopes = scopes.scopes;
      S.remap.presets = presets.presets;
      S.remap.devices = await api("GET", "/controls/devices")
        .then((r) => r.devices).catch(() => null);
      await loadBindings();
    }
  } catch (e) {
    toast("✖ " + e.message, "err");
  }
  paint();
}
async function loadBindings() {
  const r = await api("GET",
    "/controls/bindings?scope=" + encodeURIComponent(S.remap.scope))
    .catch(() => ({}));
  S.remap.bindings = r.bindings || {};
  S.remap.combos = r.combos || [];
  if (r.targets) S.remap.targets = r.targets;
}

/* =============================================================== chrome    */
function paintChrome() {
  document.body.classList.toggle("nomotion", !S.motion);
  document.getElementById("btnMotion").textContent =
    S.motion ? "REDUCE MOTION" : "MOTION: FULL";

  const p = document.getElementById("pillOnline");
  p.textContent = S.online ? "● CABINET ONLINE" : "○ CABINET OFFLINE";
  p.style.background = S.online ? "var(--lime)" : "#8a0035";
  p.style.animation = S.online || !S.motion ? "none" : "blink 1.2s steps(1) infinite";

  const ops = document.getElementById("pillOps");
  ops.textContent = S.pending
    ? "↻ " + S.pending + " OPERATION" + (S.pending > 1 ? "S" : "") + " PENDING"
    : "✓ NO PENDING OPS";
  ops.style.background = S.pending ? "#c47a00" : "#6a4a8a";

  const queue = (S.ov && S.ov.rom_queue) || [];
  const active = queue.filter((r) =>
    ["queued", "downloading", "delivering"].indexOf(r.status) >= 0);
  const xf = document.getElementById("pillXfer");
  xf.textContent = active.length
    ? "⇅ " + active[0].title + " · " + active[0].status.toUpperCase()

    ? "Showing last known values from " + new Date(S.lastSeen).toLocaleTimeString() +

    : "No cabinet has connected yet. Server-side settings still save — they sync on connect.";

    .filter((s) => s.enabled).length;
  const mq = "★ WELCOME 2 THE ARCADE CONTROL PLANE ★ " + games.length +
    " GAMES ON CAB-01 ★ DISK " + pct(hh.disk_used_pct) + " USED ★ " +
    (hh.clips || 0) + " CLIPS CACHED ★ NO CRT FILTERS WERE HARMED ★ " +
    rotating + " SOURCES IN TONIGHT'S ROTATION ★ ";

  document.getElementById("mq2").textContent = mq;

  document.getElementById("subline").textContent =

    (S.ov && S.ov.art_cache ? S.ov.art_cache.cached + " covers cached" : "—");

  document.getElementById("tabs").innerHTML = TABS.map(([k, label]) =>
    h`<button class="tab ${S.page === k ? "on" : ""}" data-act="tab" data-tab="${k}">${label}</button>`
  ).join("");
}

  <div class="row" style="margin-top:14px;">
    <button data-act="audio-apply" ${S.audioDirty ? "" : "disabled"}>APPLY MIXER</button>
    <div class="state ${S.audioState.indexOf("✔") === 0 ? "ok" : S.audioState ? "pend" : ""}">
      ${esc(S.audioState || (S.audioDirty ? "unsaved changes" : "no pending change"))}</div>
  </div>
  <div style="margin-top:14px; border:4px solid #ffd400; background:#fffbe4; border-radius:10px;
       padding:10px 12px;" class="note">
    <b style="font-family:var(--cap); font-size:13px;">ENFORCED SILENT POLICIES</b><br>
    Trailer and screensaver audio are <b>always muted on the cabinet</b> (AUD-2). Their sliders
    store a policy level for later &mdash; they are not currently audible output.
  </div>`);

ACTIONS.vol = (el) => {
  const k = el.dataset.vk, v = +el.value;
  S.audio = S.audio || {};
  if (k === "master") S.audio.master = v;
  else {
    S.audio.classes = S.audio.classes || {};
    S.audio.classes[k] = Object.assign({ volume: 100, muted: false }, S.audio.classes[k], { volume: v });
  }
  S.audioDirty = true; S.audioState = "";
  sparkle(el, v / 100);
  paint();
};
ACTIONS.mute = (el) => {
  const k = el.dataset.vk, cur = volOf(k);
  S.audio = S.audio || {};
  S.audio.classes = S.audio.classes || {};
  S.audio.classes[k] = Object.assign({}, cur, { muted: !cur.muted });
  S.audioDirty = true; S.audioState = "";
  paint();
};
ACTIONS["audio-apply"] = async () => {
  S.audioState = "applying..."; paint();
  try {
    // /volume/set takes master OR one class per call, so the mixer applies as
    // a sequence. Sequential rather than parallel on purpose: each call is a
    // git commit in the state repo, and concurrent commits would race.
    await api("POST", "/volume/set", { master: volOf("master").volume });
    for (const row of VOL_ROWS.slice(1)) {
      const v = volOf(row[0]);
      await api("POST", "/volume/set",
        { "class": row[0], volume: v.volume, muted: !!v.muted });
    }
    S.audioDirty = false; S.audioState = "✔ mixer applied";
    toast("✔ audio mixer applied to cabd", "ok");
  } catch (e) {
    S.audioState = "";
    toast("✖ mixer: " + e.message, "err");
  }
  await refresh();
};

/* ------------------------------------------------------------- screensaver */
const SS_SHUFFLE = ["in_order", "random_episode", "even_series", "round_robin", "decay"];
const SS_ASPECT = ["crop", "bars", "stretch"];
const SS_FALLBACK = ["local_clips", "dim_clock", "off"];
const SUPPRESS = [["30m", 1800], ["2h", 7200], ["8h", 28800]];
const srcId = (s) => s.plex_id || s.jellyfin_id;

VIEWS.saver = () => {
  const sv = S.saver || {};
  const added = new Map(((sv.sources) || []).map((s) => [srcId(s), s]));
  const lib = S.sources || [];
  const byId = new Map(lib.map((i) => [i.id, i]));
  const q = S.srcQuery.trim().toLowerCase();
  const hits = q ? lib.filter((i) => String(i.name || "").toLowerCase().indexOf(q) >= 0) : [];
  const pf = S.poolFilter.trim().toLowerCase();

  const pool = [...added.keys()]
    .map((id) => ({ id, meta: byId.get(id) || { id, name: id, type: "" },
                    air: !!added.get(id).enabled }))
    .filter((p) => String(p.meta.name).toLowerCase().indexOf(pf) >= 0)
    .sort((a, b) => String(a.meta.name).localeCompare(String(b.meta.name)));
  const airing = pool.filter((p) => p.air).length;

  const field = (label, node, state) => h`
    <div class="row" style="border-top:2px dotted #d3b8ff; padding-top:9px;">
      <div style="width:150px; font-size:12px; font-weight:bold;">${label}</div>
      <div style="flex:1; min-width:200px;">${node}</div>
      <div class="state" style="font-size:10px; padding:4px 8px;">${state}</div></div>`;
  const sel = (k, opts, val) => h`<select data-change="sv" data-sk="${k}">
    ${opts.map((o) => h`<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  const num = (k, val, suffix) => h`<span style="display:inline-flex; align-items:center; gap:6px;">
    <input type="number" min="0" style="width:90px" value="${val == null ? 0 : val}"
           data-change="sv" data-sk="${k}" data-k="sv-${k}"><b style="font-size:11px">${suffix}</b></span>`;

  const policy = panel("p-purp", "SCREENSAVER POLICY", h`<div class="col" style="gap:10px;">
      <div class="row">
        <div style="width:150px; font-size:12px; font-weight:bold;">Brightness</div>
        <input type="range" min="0" max="100" style="flex:1;"
               value="${sv.brightness == null ? 80 : sv.brightness}"
               data-input="sv-bright" data-k="sv-bright">
        <div style="font-family:var(--cap); font-size:15px; width:62px; text-align:center;
             border:3px solid var(--ink); border-radius:6px; padding:3px 0;">
          ${sv.brightness == null ? 80 : sv.brightness}%</div>
      </div>
      ${field("Idle timeout", num("idle_seconds", sv.idle_seconds, "seconds"), "stored")}
      ${field("Aspect", sel("aspect", SS_ASPECT, sv.aspect), "live")}
      ${field("Shuffle", sel("shuffle", SS_SHUFFLE, sv.shuffle), "live")}
      ${field("Movies = own series", h`<label style="font-size:12px; font-weight:bold;
          display:inline-flex; gap:6px; align-items:center;">
          <input type="checkbox" data-change="sv" data-sk="movies_as_series"
                 ${sv.movies_as_series ? "checked" : ""}> each movie counts as its own series</label>`, "live")}
      ${field("Skip intro", num("skip_intro_s", sv.skip_intro_s, "seconds"), "stored")}
      ${field("Skip outro", num("skip_outro_s", sv.skip_outro_s, "seconds"), "stored")}
      ${field("Fallback", sel("fallback", SS_FALLBACK, sv.fallback), "live")}
      <div class="row" style="border-top:4px double var(--purp); padding-top:10px;">
        <button data-act="sv-apply" ${S.saverDirty ? "" : "disabled"}>SET / APPLY</button>
        <div class="state ${S.saverState.indexOf("✔") === 0 ? "ok" : S.saverState ? "pend" : ""}">
          ${esc(S.saverState || (S.saverDirty ? "unsaved changes" : "no pending change"))}</div>
      </div>
      <div class="row" style="border-top:2px dotted #d3b8ff; padding-top:10px;">
        <div style="width:150px; font-size:12px; font-weight:bold;">Suppress</div>
        ${SUPPRESS.map((s) => h`<button class="sm grey" data-act="sv-suppress" data-secs="${s[1]}"
          ${off() ? "disabled" : ""}>OFF FOR ${s[0]}</button>`).join("")}
        <button class="sm lime" data-act="sv-suppress" data-secs="0" ${off() ? "disabled" : ""}>RESUME</button>
      </div>
      <div class="note" style="border:3px dashed var(--purp); padding:8px; border-radius:8px;
           background:#f7f0ff;"><b>LEGACY mode:</b> <code>${esc(sv.mode || "shuffle_episodes")}</code>
        &mdash; the richer <code>shuffle</code> policy above wins when both are set.</div>
      ${gapNote("“UNTIL REBOOT” SUPPRESSION",
        "<code>/screensaver/disable</code> takes a duration in seconds. An indefinite suppression that survives to the next boot has no representation in cabd yet.")}
    </div>`);

  const search = panel("p-hot", "FIND &amp; ADD SOURCES (" +
    (lib.length ? lib.length + " IN LIBRARY" : "LIBRARY NOT LOADED") + ")",
    h`<div class="col" style="gap:10px;">
      <div class="note">Nothing is listed until you search &mdash; the library is huge. Find a show
        or movie once, ADD it, and it lives on the rotation board below where you flip it ON or OFF.</div>
      <input type="search" placeholder="search shows &amp; movies..." value="${esc(S.srcQuery)}"
             data-input="src-q" data-k="src-q" style="font-size:14px; padding:9px;">
      <div style="font-size:11px; font-weight:bold; color:#6a4a8a;">
        ${S.srcLoading ? "loading library from plex..."
          : !lib.length ? "library unavailable — is Plex reachable?"
          : q ? (hits.length
                  ? "showing " + Math.min(hits.length, 8) + " of " + hits.length + " matches"
                  : "no matches for “" + esc(S.srcQuery) + "”")
              : "type at least one letter to search the library"}</div>
      ${hits.slice(0, 8).map((i) => {
        const on = added.has(i.id);
        return h`<div style="display:flex; align-items:center; gap:10px; padding:8px 9px;
            border-radius:9px; border:3px solid ${on ? "#8fe36a" : "#e0cff0"};
            background:${on ? "#f6fff2" : "#fdfbff"};">
          <img class="thumb" src="/thumb/${encodeURIComponent(i.id)}" alt=""
               onerror="this.style.visibility='hidden'">
          <div style="flex:1; min-width:0;">
            <b style="font-size:13px;">${esc(i.name)}</b>
            <div style="font-size:10.5px; font-weight:bold; opacity:.7;">${esc(i.type || "")}
              · ${on ? "already on the board (" + (added.get(i.id).enabled ? "ON" : "OFF") + ")"
                          : "not added yet"}</div></div>
          <button class="sm lime" data-act="src-add" data-sid="${esc(i.id)}" ${on ? "disabled" : ""}>
            ${on ? "ON BOARD ✓" : "+ ADD"}</button></div>`;
      }).join("")}
    </div>`);

  const board = panel("p-lime",
    "ROTATION BOARD &mdash; " + pool.length + " ADDED · " + airing + " ON", h`
    <div class="row" style="margin-bottom:12px;">
      <input type="text" placeholder="filter the pool..." value="${esc(S.poolFilter)}"
             data-input="pool-f" data-k="pool-f" style="min-width:200px;">
      <button class="sm" data-act="src-all" data-on="1">TURN ALL ON</button>
      <button class="sm grey" data-act="src-all" data-on="">TURN ALL OFF</button>
      <div style="font-size:10.5px; font-weight:bold; color:#3a1a6a; background:#f6f0ff;
           border:3px solid #d3b8ff; border-radius:8px; padding:6px 9px;">
        ON = in tonight's rotation · OFF = added but skipped · REMOVE takes it off entirely</div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:10px;">
    ${pool.map((p) => h`<div style="border:4px solid ${p.air ? "var(--lime)" : "#c9b8dd"};
        border-radius:11px; padding:9px 10px;
        background:${p.air ? "linear-gradient(180deg,#fbfff8,#eaffe4)" : "#f7f4fa"};
        box-shadow:3px 3px 0 ${p.air ? "rgba(31,168,60,.3)" : "rgba(27,11,46,.12)"};">
      <div style="display:flex; gap:8px; align-items:center;">
        <img class="thumb" src="/thumb/${encodeURIComponent(p.id)}" alt=""
             onerror="this.style.visibility='hidden'">
        <div style="flex:1; min-width:0;">
          <b style="font-size:13px; display:block; overflow:hidden; text-overflow:ellipsis;
             white-space:nowrap;">${esc(p.meta.name)}</b>
          <span style="font-size:10px; font-weight:bold; opacity:.7;">${esc(p.meta.type || "")}
            · ${p.air ? "IN ROTATION" : "SKIPPED"}</span></div>
        <button class="sm ${p.air ? "lime" : "grey"}" data-act="src-toggle"
                data-sid="${esc(p.id)}" data-on="${p.air ? "" : "1"}">${p.air ? "ON" : "OFF"}</button>
      </div>
      <button class="xs danger" style="width:100%; margin-top:8px;" data-act="src-remove"
              data-sid="${esc(p.id)}" data-name="${esc(p.meta.name)}">REMOVE</button>
    </div>`).join("")}</div>
    ${pool.length ? "" : h`<div class="note" style="opacity:.7; padding:10px 0;">
      Pool is empty &mdash; search above and add something ✨</div>`}`);

  return h`<div class="col"><div class="grid g-half">${policy}${search}</div>${board}</div>`;
};

ACTIONS["sv-bright"] = (el) => {
  S.saver = S.saver || {};
  S.saver.brightness = +el.value;
  S.saverDirty = true; S.saverState = "";
  sparkle(el, +el.value / 100); paint();
};
ACTIONS.sv = (el) => {
  S.saver = S.saver || {};
  S.saver[el.dataset.sk] = el.type === "checkbox" ? el.checked
                         : el.type === "number" ? +el.value : el.value;
  S.saverDirty = true; S.saverState = ""; paint();
};
ACTIONS["sv-apply"] = async () => {
  const sv = S.saver || {};
  S.saverState = "applying..."; paint();
  try {
    await api("POST", "/screensaver/set", {
      brightness: sv.brightness, idle_seconds: sv.idle_seconds,
      aspect: sv.aspect, shuffle: sv.shuffle, fallback: sv.fallback,
      movies_as_series: !!sv.movies_as_series,
      skip_intro_s: sv.skip_intro_s, skip_outro_s: sv.skip_outro_s,
    });
    S.saverDirty = false; S.saverState = "✔ policy applied";
    toast("✔ screensaver policy applied", "ok");
  } catch (e) {
    S.saverState = ""; toast("✖ screensaver: " + e.message, "err");
  }
  await refresh();
};
ACTIONS["sv-suppress"] = (el) => {
  const s = +el.dataset.secs;
  op(s ? "suppress screensaver " + s + "s" : "resume screensaver",
     () => api("POST", "/screensaver/disable", { seconds: s }));
};
ACTIONS["src-q"] = (el) => { S.srcQuery = el.value; paint(); };
ACTIONS["pool-f"] = (el) => { S.poolFilter = el.value; paint(); };
ACTIONS["src-add"] = (el) =>
  op("add source", () => api("POST", "/screensaver/set-source",
    { id: el.dataset.sid, enabled: true }), "✔ added — rotation ON");
ACTIONS["src-toggle"] = (el) =>
  op("toggle source", () => api("POST", "/screensaver/set-source",
    { id: el.dataset.sid, enabled: !!el.dataset.on }), null);
ACTIONS["src-remove"] = async (el) => {
  if (await ask("Remove " + el.dataset.name + " from the rotation board? " +
                "You'd have to search for it again to add it back."))
    op("remove source", () => api("POST", "/screensaver/remove-source", { id: el.dataset.sid }));
};
ACTIONS["src-all"] = async (el) => {
  const want = !!el.dataset.on;
  const todo = ((S.saver && S.saver.sources) || []).filter((s) => !!s.enabled !== want);
  if (!todo.length) return toast("nothing to change", "warn");
  S.pending++; paintChrome();
  try {
    for (const s of todo) {
      await api("POST", "/screensaver/set-source", { id: srcId(s), enabled: want });
    }
    toast("✔ turned " + todo.length + " source(s) " + (want ? "ON" : "OFF"), "ok");
  } catch (e) {
    toast("✖ " + e.message, "err");
  } finally {
    S.pending--; await refresh();
  }
};

/* --------------------------------------------------------------- streaming */

const FPS = ["30", "60", "120"];

  const apps = cfg.entries || [];
  const defaults = cfg.defaults || {};
  const colors = ["p-blue", "p-aqua", "p-purp"];
  return h`<div class="col">
  ${apps.map((a, i) => {
    const q = Object.assign({}, defaults, a.quality || {});
    const games = a.games || [];
    return panel(colors[i % 3], esc(a.name) + " &mdash; " + esc(a.kind), h`
      <div class="rowe" style="gap:16px; padding-bottom:12px; border-bottom:3px dotted #cbb8e6;">
        <label class="field">RESOLUTION
          <select data-change="app-q" data-app="${esc(a.name)}" data-qk="resolution" style="min-width:130px">

          <select data-change="app-q" data-app="${esc(a.name)}" data-qk="fps" style="min-width:90px">

        <div style="border:3px dashed var(--blue); border-radius:9px; padding:6px 10px;

          <div style="font-size:10px; letter-spacing:.1em; opacity:.7;">CURRENT EFFECTIVE</div>
          <b style="font-family:ui-monospace,monospace; font-size:13px;">${esc(q.resolution)}

        <div style="font-family:var(--cap); font-size:13px; margin-bottom:8px;">

        <table><thead><tr><th>ON CAB</th><th>TITLE</th><th>LAUNCH TARGET</th><th>ACTIONS</th></tr></thead>
        <tbody>
        ${games.map((g) => h`<tr>
          <td><button class="xs ${g.enabled !== false ? "lime" : "grey"}" data-act="sgame-toggle"
                data-app="${esc(a.name)}" data-title="${esc(g.title)}"
                data-on="${g.enabled !== false ? "" : "1"}">${g.enabled !== false ? "ON" : "OFF"}</button></td>
          <td><b>${esc(g.title)}</b></td>
          <td><code style="font-size:11px">${esc(g.target)}</code></td>
          <td><button class="xs danger" data-act="sgame-remove" data-app="${esc(a.name)}"
                data-title="${esc(g.title)}">REMOVE</button></td></tr>`).join("")
          || h`<tr><td colspan="4" class="note" style="opacity:.7">no games pinned for this service yet</td></tr>`}
        </tbody></table>
        <div class="rowe" style="margin-top:10px; border-top:3px dotted #cbb8e6; padding-top:10px;">

            <input type="text" placeholder="e.g. Forza Horizon 5" style="min-width:200px"
                   data-k="ngt-${esc(a.name)}" id="ngt-${i}"></label>

            <input type="text" placeholder="${esc(a.kind)}:${esc(a.target)}" style="min-width:250px"

  }).join("") || h`<div class="note">no streaming apps configured in <code>streaming.yaml</code></div>`}
  <div class="note" style="opacity:.75;">Apps come from <code>streaming.yaml</code>; game lists here
    are written back to it and rendered into the cabinet's Streaming collection on the next sync.</div>
  ${gapNote("PER-GAME QUALITY OVERRIDES",
    "The state schema stores a <code>quality</code> block per game and <code>/stream/games/set</code> accepts one, but nothing consumes it yet &mdash; cabd applies the app-level quality when it launches a stream.")}
  </div>`;
};

ACTIONS["app-q"] = (el) => {
  const app = el.dataset.app, k = el.dataset.qk;
  const val = k === "resolution" ? el.value : +el.value;
  const body = { app: app };
  body[k] = val;
  op("set " + app + " " + k, () => api("POST", "/stream/set-quality", body),
     "✔ " + app + ": " + k + " = " + val);
};
ACTIONS["app-launch"] = (el) =>
  op("launch " + el.dataset.app, () => api("POST", "/stream/launch", { app: el.dataset.app }));
ACTIONS["sgame-toggle"] = (el) =>
  op("toggle game", () => api("POST", "/stream/games/set",
    { app: el.dataset.app, title: el.dataset.title, enabled: !!el.dataset.on }), null);
ACTIONS["sgame-remove"] = async (el) => {
  if (await ask("Remove " + el.dataset.title + " from " + el.dataset.app +
                "? It disappears from the cabinet Streaming collection after sync."))
    op("remove game", () => api("POST", "/stream/games/remove",
      { app: el.dataset.app, title: el.dataset.title }));
};
ACTIONS["sgame-add"] = (el) => {
  const i = el.dataset.i;
  const t = document.getElementById("ngt-" + i).value.trim();
  const g = document.getElementById("ngg-" + i).value.trim();
  if (!t || !g) return toast("✖ need a title AND a launch target", "err");
  op("add game", () => api("POST", "/stream/games/set",
    { app: el.dataset.app, title: t, target: g }),
     "✔ added " + t + " to " + el.dataset.app);
};

/* Gauge trio for the health tab, fed by cabd's 1 Hz sampler. Each one degrades
   independently: a cabinet with no amdgpu node shows the GPU card greyed with
   its reason rather than a fake 0%. */
const GB = (b) => (b == null ? null : (b / 1073741824).toFixed(1) + " GB");
function gauge(name, color, pct, big, rows, pctl, unit) {
  const has = pct != null;
  const hot = has && pct > 85;
  return h`<div style="border:4px solid ${has ? color : "var(--grey)"}; border-radius:10px;
      background:#fff; box-shadow:3px 3px 0 rgba(27,11,46,.18); overflow:hidden;
      opacity:${has ? 1 : 0.6};">
    <div style="font-family:var(--cap); font-size:11px; letter-spacing:.08em; color:#fff;
         padding:5px 9px; text-shadow:0 2px 0 rgba(0,0,0,.35);
         background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),
                    ${has ? color : "var(--grey)"};">${name}</div>
    <div style="padding:8px 10px 10px; display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; align-items:baseline; gap:6px; white-space:nowrap;">
        <b style="font-family:var(--cap); font-size:24px; color:${hot ? "#c1004a" : has ? color : "var(--grey)"}">
          ${has ? Math.round(pct) + (unit || "%") : "—"}</b>
        <span style="font-size:10px; font-weight:bold; opacity:.7;">${esc(big || "")}</span>
      </div>
      <div class="meter" style="height:16px; border-width:3px;">
        <i class="${hot ? "hot" : ""}" style="width:${has ? pct : 0}%; background:${
          hot ? "" : "repeating-linear-gradient(90deg," + color + "aa 0 8px," + color + " 8px 16px)"}"></i>
      </div>
      ${rows.map((r) => h`<div style="display:flex; justify-content:space-between; gap:8px;
        font-size:10.5px; font-weight:bold; border-bottom:1px dotted #e0cff0; padding:2px 0;">
        <span>${esc(r[0])}</span><b style="font-family:ui-monospace,monospace">${esc(dash(r[1]))}</b></div>`).join("")}
      ${pctl ? h`<div style="display:flex; justify-content:space-between; gap:8px;
        font-size:10.5px; font-weight:bold; padding:2px 0;">
        <span>p99 / p95 / p90</span><b style="font-family:ui-monospace,monospace">${esc(pctl)}</b></div>` : ""}
    </div></div>`;
}
function gauges(m) {
  if (!m) {
    return gapNote("NO SAMPLER DATA",
      "The cabinet has not reported a <code>metrics</code> block — it is offline, or running a cabd older than the sampler.");
  }
  const c = m.current || {}, p = m.percentiles || {}, f = m.facts || {};
  const trio = (k, unit, digits) => {
    const v = p[k];
    if (!v) return null;
    const fmt = (x) => (x == null ? "—" : digits ? (x / 1073741824).toFixed(1) : Math.round(x));
    return fmt(v.p99) + " / " + fmt(v.p95) + " / " + fmt(v.p90) + (unit || "");
  };
  const memPct = c.mem_total ? (100 * c.mem_used / c.mem_total) : null;
  const vramPct = c.vram_total ? (100 * c.vram_used / c.vram_total) : null;
  return h`<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;">
    ${gauge("CPU", "#0b3fd1", c.cpu_pct,
      c.cpu_temp_c != null ? c.cpu_temp_c + " °C" : "",
      [["model", f.cpu_model], ["cores", f.cpu_cores && f.cpu_threads
        ? f.cpu_cores + "c / " + f.cpu_threads + "t" : f.cpu_threads]],
      trio("cpu_pct", "%"))}
    ${gauge("GPU", "#7b2dff", c.gpu_pct,
      c.gpu_temp_c != null ? c.gpu_temp_c + " °C" : "",
      [["vram", c.vram_total ? GB(c.vram_used) + " / " + GB(c.vram_total) : null],
       ["vram used", vramPct == null ? null : Math.round(vramPct) + "%"]],
      trio("gpu_pct", "%"))}
    ${gauge("MEMORY", "#1fa83c", memPct,
      c.mem_total ? GB(c.mem_used) + " / " + GB(c.mem_total) : "",
      [["swap", c.swap_total ? GB(c.swap_used) + " / " + GB(c.swap_total) : null],
       ["window", m.samples + " samples / " + Math.round((m.window_s || 0) / 60) + "m"]],
      trio("mem_used", " GB", true))}
  </div>`;
}

ACTIONS["rm-scope"] = async (el) => {
  S.remap.scope = el.value;
  S.remap.capture = null; S.remap.combo = []; S.remap.hold = 0;
  S.remap.stage = "idle";
  S.remap.msg = "scope changed to " + el.value;
  await loadBindings(); paint();
};
ACTIONS["rm-capture"] = async (el) => {
  const rm = S.remap;
  const adding = !!(el && el.dataset.add);
  rm.stage = "waiting";
  if (!adding) rm.combo = [];
  rm.msg = adding ? "press the NEXT button in the combo..."
                  : "press a button on the cabinet panel now...";
  paint();
  try {
    const r = await api("POST", "/controls/monitor", { seconds: 5 });
    const ev = (r.events || [])[0];
    if (!ev) {
      rm.stage = "err";
      rm.msg = "no input seen in 5s — is the panel connected?";
    } else {
      /* cabd reports raw monitor lines ("a down") as well as structured
         events, depending on the input source; take the button either way */
      const btn = String(ev.button || ev.key || ev).split(/\s+/)[0].toLowerCase();
      if (rm.combo.indexOf(btn) < 0) rm.combo.push(btn);
      rm.capture = rm.combo.join(" + ");
      rm.stage = "captured";
      rm.msg = rm.combo.length > 1
        ? "combo is now " + rm.capture + " — pick a trigger style, then a target"
        : "captured " + btn + " — add another button, or pick a target";
    }
  } catch (e) {
    rm.stage = "err";
    rm.msg = "capture failed: " + e.message;
  }
  paint();
};
ACTIONS["rm-hold"] = (el) => { S.remap.hold = +el.dataset.ms; paint(); };
ACTIONS["rm-clear"] = () => {
  Object.assign(S.remap, { capture: null, combo: [], hold: 0,
                           stage: "idle", msg: "capture cleared" });
  paint();
};
ACTIONS["rm-bind"] = async (el) => {
  const rm = S.remap;
  if (!rm.combo.length) return;
  const target = el.dataset.t;
  const expr = rm.combo.join(" + ") + (rm.hold ? " (hold " + rm.hold / 1000 + "s)" : "");
  /* A single tap onto a pad button is expressible in RetroArch's own remap,
     so it goes through /controls/map and stays where the emulator applies it.
     Anything with a combo, a hold, or an action target has to be a cabd-side
     binding — RetroArch's format cannot represent it. */
  const plain = rm.combo.length === 1 && !rm.hold &&
                (rm.targets.pad || LOGICAL).indexOf(target) >= 0;
  try {
    if (plain) {
      const set = {};
      set[rm.combo[0]] = target;
      await op("bind " + expr + " → " + target,
        () => api("POST", "/controls/map", { scope: rm.scope, set: set }));
    } else {
      await op("bind " + expr + " → " + target,
        () => api("POST", "/controls/bind", { scope: rm.scope,
          buttons: rm.combo, hold_ms: rm.hold, target: target }));
    }
    rm.stage = "saved";
    rm.msg = "✔ " + expr + " → " + target + " in " + rm.scope;
    rm.combo = []; rm.capture = null; rm.hold = 0;
  } catch (_) {
    rm.stage = "err";
  }
  await loadBindings(); paint();
};
ACTIONS["rm-unbind-combo"] = async (el) => {
  try {
    await op("unbind " + el.dataset.buttons, () => api("POST", "/controls/unbind-combo",
      { scope: S.remap.scope, buttons: el.dataset.buttons.split("+"),
        hold_ms: +el.dataset.hold }));

  await loadBindings(); paint();

ACTIONS["rm-unbind"] = async (el) => {
  try {
    await op("unbind " + el.dataset.key, () => api("POST", "/controls/unbind",
      { scope: S.remap.scope, key: el.dataset.key }));
  } catch (_) { /* toasted by op */ }
  await loadBindings(); paint();

ACTIONS["rm-pname"] = (el) => { S.remap.presetName = el.value; };
ACTIONS["rm-save"] = async () => {
  const name = S.remap.presetName.trim();
  if (!name) return toast("✖ name the preset first", "err");
  try {
    await op("save preset " + name, () => api("POST", "/controls/save-preset", { name: name }));

  if (!await ask("Load preset " + el.dataset.p + "? It replaces every mapping layer it captured."))
    return;

      () => api("POST", "/controls/load-preset", { name: el.dataset.p }));

ACTIONS["rm-monitor"] = async () => {
  const out = document.getElementById("benchOut");
  out.textContent = "listening 5s...";
  try {
    const r = await api("POST", "/controls/monitor", { seconds: 5 });

          ${g.favorite ? "UNFAV" : "FAV"}</button>
      </div></td></tr>`).join("")
      || h`<tr><td colspan="5" class="note" style="opacity:.7">${off()
            ? "cabinet offline — library unknown" : "nothing matches those filters"}</td></tr>`}
    </tbody></table>`)}
  ${panel("p-purp", "TRANSFER QUEUE", gapNote(
    "LOAD / UNLOAD AND THE TRANSFER QUEUE ARE NOT BUILT",
    "The design treats the server as a big library and the cabinet as a small cache you load games into and unload them from, with per-transfer progress. Today there is no server-side game store: <code>library.list</code> reports the cabinet's own <code>/roms</code> tree and that is the only library there is. So this table is read-only plus launch and favorite. The gap report lists what building it needs."))}
  </div>`;
};

ACTIONS["lib-sys"] = (el) => { S.lib.sys = el.value; paint(); };
ACTIONS["lib-q"] = (el) => { S.lib.q = el.value; paint(); };
ACTIONS["lib-fav"] = () => { S.lib.favOnly = !S.lib.favOnly; paint(); };
ACTIONS["lib-launch"] = (el) =>
  op("launch", () => api("POST", "/games/launch",
    { system: el.dataset.sys, path: el.dataset.path }));
ACTIONS["lib-fav-toggle"] = (el) =>
  op("favorite", () => api("POST", el.dataset.on ? "/favorites/add" : "/favorites/remove",
    { id: el.dataset.id }), el.dataset.on ? "★ favorited" : "☆ unfavorited");

/* ---------------------------------------------------------------- rom queue */
const ROM_BADGE = {
  ready: "var(--lime)", error: "var(--red)", downloading: "var(--blue)",
  delivering: "var(--purp)", queued: "#c47a00",
};
VIEWS.rom = () => {
  const q = (S.ov && S.ov.rom_queue) || [];
  const be = S.romBackend || {};
  const systems = be.systems || [];
  const cov = (be.coverage || {})[S.rom.system];
  return h`<div class="col">
  ${panel("p-hot", "REQUEST A ROM", h`
    <div class="rowe">
      <label class="field" style="flex:1; min-width:240px;">TITLE / QUERY
        <input type="text" placeholder="e.g. Super Mario World"
               style="width:100%; font-size:14px; padding:9px;"
               value="${esc(S.rom.query)}" data-input="rom-q" data-k="rom-q"></label>
      <label class="field">SYSTEM
        <select data-change="rom-sys" style="min-width:150px; font-size:14px; padding:8px;">
          <option value="">— pick one —</option>
          ${systems.map((s) => h`<option ${s === S.rom.system ? "selected" : ""}>${esc(s)}</option>`).join("")}
        </select></label>
      <button data-act="rom-search">SEARCH SOURCES</button>
      <button class="grey sm" data-act="rom-sync">RETRY ALL FAILED</button>
      <div class="state">backend: ${esc(be.backend || "?")}</div>
    </div>
    ${cov ? h`<div class="gap"><b>NO LIVE SOURCE FOR ${esc(S.rom.system.toUpperCase())}</b><br>${esc(cov)}</div>` : ""}
    ${be.backend === "fake" ? gapNote("FAKE ROMDL BACKEND",
      "<code>ROMDL_BACKEND=fake</code> — this server is serving a generated test catalogue, not real sources. That is the sim's configuration.") : ""}`)}
  ${panel("p-blue", "QUEUE (" + q.length + ")", h`
    <table><thead><tr><th>TITLE</th><th>STATUS</th><th>DETAIL / ERROR</th><th>ACTIONS</th></tr></thead>
    <tbody>
    ${q.map((r) => h`<tr>
      <td><b>${esc(r.title)}</b></td>
      <td>${badge(r.status, ROM_BADGE[r.status] || "#6a4a8a")}${
        r.status === "downloading" && r.bytes_done
          ? h`<div class="note" style="font-size:10px;">${
              (r.bytes_done / 1048576).toFixed(1)} MB${
              r.bytes_total ? " / " + (r.bytes_total / 1048576).toFixed(1)
              + " MB (" + Math.round(r.bytes_done * 100 / r.bytes_total)
              + "%)" : ""}</div>` : ""}</td>
      <td><span style="font-family:ui-monospace,monospace; font-size:11px;">${esc(r.detail || "")}</span></td>
      <td><div class="row" style="gap:4px;">
        <button class="xs" data-act="rom-retry" data-id="${esc(r.id)}"
          ${["queued", "downloading", "delivering"].indexOf(r.status) >= 0 ? "disabled" : ""}>RETRY</button>
        <button class="xs danger" data-act="rom-cancel" data-id="${esc(r.id)}"
          ${r.status === "delivering" ? "disabled" : ""}>${
          r.status === "downloading" ? "CANCEL" : "DROP"}</button>
      </div></td></tr>`).join("")
      || h`<tr><td colspan="4" class="note" style="opacity:.7">queue is empty</td></tr>`}
    </tbody></table>`)}
  <div id="romSearch"></div></div>`;
};

ACTIONS["rom-q"] = (el) => { S.rom.query = el.value; };
ACTIONS["rom-sys"] = (el) => { S.rom.system = el.value; paint(); };
ACTIONS["rom-search"] = async () => {
  const query = S.rom.query.trim();
  if (!query) return toast("✖ type something to search for", "err");
  const host = document.getElementById("romSearch");
  host.innerHTML = h`<div class="note">searching sources — this can take a minute...</div>`;
  try {
    const qs = "q=" + encodeURIComponent(query) +
      (S.rom.system ? "&system=" + encodeURIComponent(S.rom.system) : "");
    const r = await api("GET", "/roms/search?" + qs);
    const list = Array.isArray(r) ? r : (r.results || []);
    const note = (r && r.note) || "";
    host.innerHTML = panel("p-lime", "SOURCE MATCHES (" + list.length + ")", h`
      ${note ? h`<div class="gap"><b>NOTHING TO SEARCH</b><br>${esc(note)}</div>` : ""}
      <table><thead><tr><th>SCORE</th><th>TITLE</th><th>SOURCE</th><th>SYSTEM</th><th></th></tr></thead><tbody>
      ${list.map((c) => h`<tr>
        <td><code style="font-size:11px">${esc(c.score == null ? "—" : c.score)}</code></td>
        <td><b>${esc(c.title || "")}</b></td>
        <td>${esc(c.source || "")}</td>
        <td>${esc(c.system || "")}</td>
        <td><button class="xs" data-act="rom-queue" data-id="${esc(c.id)}"
              data-title="${esc(c.title || "")}" data-sys="${esc(c.system || "")}">QUEUE THIS</button></td>
      </tr>`).join("")
        || (note ? "" : h`<tr><td colspan="5" class="note" style="opacity:.7">no source matched</td></tr>`)}
      </tbody></table>`);
  } catch (e) {
    host.innerHTML = panel("p-red", "SEARCH FAILED", h`<div class="note">${esc(e.message)}</div>`);
  }
};
/* Queue the exact candidate that was picked, by id — not a second
   "best match" search, which could rank a different dump first. */
ACTIONS["rom-queue"] = (el) =>
  op("queue " + el.dataset.title, () => api("POST", "/roms/request",
    { id: el.dataset.id, title: el.dataset.title, system: el.dataset.sys }),
     "✔ queued: " + el.dataset.title);
ACTIONS["rom-sync"] = () => op("retry failed roms", async () => {
  const r = await api("POST", "/roms/sync");
  toast("✔ retried " + r.retried.length + ", rescan " + (r.rescan ? "ok" : "failed"), "ok");
  return r;
}, null);
ACTIONS["rom-retry"] = (el) => op("retry", () => api("POST", "/roms/retry", { id: el.dataset.id }));
ACTIONS["rom-cancel"] = (el) => op("drop", () => api("POST", "/roms/cancel", { id: el.dataset.id }));

/* ------------------------------------------------------- broadcast / integrations */
VIEWS.integ = () => {
  const I = S.integ;
  if (!I) return h`<div class="note">loading integrations…</div>`;
  const d = I.config.discord || {}, ha = I.config.homeassistant || {};
  const st = I.status || {}, snap = I.snapshot || {};

  const field = (section, key, label, type, placeholder, hint) => h`
    <label class="field" style="display:block; margin-bottom:9px;">${label}
      <input type="${type || "text"}" style="width:100%; max-width:520px;"
             placeholder="${esc(placeholder || "")}"
             value="${esc((I.config[section] || {})[key] == null ? "" : (I.config[section] || {})[key])}"
             data-input="integ-f" data-sec="${section}" data-key="${key}"
             data-k="integ-${section}-${key}">
      ${hint ? h`<span style="font-size:10px; font-weight:bold; opacity:.7;
        display:block; margin-top:3px;">${hint}</span>` : ""}</label>`;
  const toggle = (section, key, label) => h`
    <label style="font-size:12px; font-weight:bold; display:inline-flex;
        gap:6px; align-items:center; margin-right:14px;">
      <input type="checkbox" data-change="integ-t" data-sec="${section}" data-key="${key}"
             ${(I.config[section] || {})[key] ? "checked" : ""}> ${label}</label>`;

  const nowPlaying = panel("p-aqua", "WHAT WOULD BE BROADCAST RIGHT NOW", h`
    <div class="row">
      <div class="state ${snap.state === "playing" ? "ok" : ""}">${esc(snap.state || "?")}</div>
      <div class="kv" style="flex:1; border:none;">
        <span>Title</span><b>${esc(snap.title || "—")}</b></div>
      <div class="kv" style="flex:1; border:none;">
        <span>System</span><b>${esc((snap.system || "—").toUpperCase())}</b></div>
      <div class="kv" style="flex:1; border:none;">
        <span>Elapsed</span><b>${esc(hms(snap.elapsed_s))}</b></div>
    </div>
    ${snap.art_url ? h`<div class="note" style="opacity:.7; margin-top:6px;">
      art: <code>${esc(snap.art_url)}</code></div>` : ""}
    ${I.config.public_base_url ? "" : gapNote("NO PUBLIC BASE URL",
      "Set <b>public base URL</b> below, or Discord embeds and the Home Assistant entity picture have no reachable image.")}`);

  const discord = panel("p-purp", "DISCORD", h`
    <div class="row" style="margin-bottom:10px;">
      ${toggle("discord", "enabled", "Enabled")}
      ${toggle("discord", "post_on_start", "Post when a game starts")}
      ${toggle("discord", "post_on_stop", "Post when it stops")}
    </div>
    ${field("discord", "webhook_url", "CHANNEL WEBHOOK URL", "text",
            "https://discord.com/api/webhooks/…",
            d.webhook_url_set ? "a value is saved — leave the dots to keep it" : "")}
    ${field("discord", "username", "POST AS", "text", "CAB-01")}
    ${field("discord", "mention", "MENTION (optional)", "text", "<@&role-id>")}
    <div class="row" style="margin-top:8px;">
      <button data-act="integ-save" ${S.integDirty ? "" : "disabled"}>SAVE</button>
      <button class="grey sm" data-act="integ-test" data-which="discord">SEND TEST MESSAGE</button>
      <div class="state ${st.discord && st.discord.enabled ? "ok" : ""}">
        ${st.discord && st.discord.enabled ? "active" : "off"}</div>
    </div>
    <div class="gap"><b>WEBHOOK, NOT RICH PRESENCE</b><br>
      Discord Rich Presence (the &ldquo;Playing&hellip;&rdquo; line under a username) is delivered by a
      <i>local desktop Discord client</i> over an IPC socket. The cabinet does not run one, and
      the server is not your account. A channel webhook posts an embed with the title, system,
      play time and box art instead — which is the part that is actually shareable.</div>`);

  const hass = panel("p-blue", "HOME ASSISTANT", h`
    <div class="row" style="margin-bottom:10px;">${toggle("homeassistant", "enabled", "Enabled")}</div>
    ${field("homeassistant", "mqtt_host", "MQTT BROKER HOST", "text", "homeassistant.local")}
    ${field("homeassistant", "mqtt_port", "MQTT PORT", "number", "1883")}
    ${field("homeassistant", "mqtt_username", "MQTT USERNAME", "text", "")}
    ${field("homeassistant", "mqtt_password", "MQTT PASSWORD", "password", "",
            ha.mqtt_password_set ? "a value is saved — leave the dots to keep it" : "")}
    ${field("homeassistant", "device_name", "DEVICE NAME IN HA", "text", "Arcade Cabinet")}
    ${field("homeassistant", "node_id", "NODE ID", "text", "arcade_cabinet",
            "changing this creates a second device in HA")}
    <div style="border-top:3px dotted #cbb8e6; margin:12px 0 10px; padding-top:10px;">
      <div style="font-family:var(--cap); font-size:12px; margin-bottom:8px;">
        MEDIA PLAYER (OPTIONAL, SEPARATE TRANSPORT)</div>
      ${field("homeassistant", "rest_url", "HOME ASSISTANT URL", "text",
              "http://homeassistant.local:8123")}
      ${field("homeassistant", "rest_token", "LONG-LIVED ACCESS TOKEN", "password", "",
              ha.rest_token_set ? "a value is saved — leave the dots to keep it"
                                : "HA profile → Security → Long-lived access tokens")}
    </div>
    <div class="row" style="margin-top:8px;">
      <button data-act="integ-save" ${S.integDirty ? "" : "disabled"}>SAVE</button>
      <button class="grey sm" data-act="integ-test" data-which="homeassistant">CONNECT &amp; ANNOUNCE</button>
      <div class="state ${st.homeassistant && st.homeassistant.connected ? "ok"
                        : st.homeassistant && st.homeassistant.enabled ? "pend" : ""}">
        ${st.homeassistant && st.homeassistant.connected ? "mqtt connected"
          : st.homeassistant && st.homeassistant.enabled ? "mqtt not connected" : "off"}</div>
      <div class="state ${st.homeassistant && st.homeassistant.media_player ? "ok" : ""}">
        ${st.homeassistant && st.homeassistant.media_player
          ? "media player: " + esc(st.homeassistant.entity_id) : "media player: off"}</div>
    </div>
    <div class="note" style="margin-top:10px; border:3px dashed var(--blue);
         padding:8px; border-radius:8px; background:#f2f6ff;">
      <b>Over MQTT discovery</b> (appears on its own, controllable, survives restarts):
      a <b>screensaver switch</b>, a <b>stop-game button</b>, a <b>connectivity</b> binary
      sensor, and sensors for now-playing title, system, play time, CPU, GPU, memory,
      CPU temperature and disk. Availability is an MQTT last-will, so HA marks the
      cabinet unavailable if the server goes away instead of showing a stale game.</div>
    <div class="gap"><b>WHY THE MEDIA PLAYER NEEDS A TOKEN</b><br>
      Home Assistant's MQTT integration has no <code>media_player</code> platform — a
      discovery topic for one is accepted by the broker and then ignored, which looks
      like it worked until you go looking for the entity. The media card is pushed to
      HA's REST API instead. Two consequences worth knowing: HA cannot call services on
      a REST-pushed entity (use the switch and button above for control), and its state
      is dropped on an HA restart — we re-push every heartbeat, so it returns in seconds.</div>
    ${st.last_error ? h`<div class="gap"><b>LAST ERROR</b><br>${esc(st.last_error)}</div>` : ""}`);

  const shared = panel("p-yel", "SHARED", h`
    <label class="field" style="display:block;">PUBLIC BASE URL OF THIS SERVER
      <input type="text" style="width:100%; max-width:520px;"
             placeholder="http://192.168.1.10:8000"
             value="${esc(I.config.public_base_url || "")}"
             data-input="integ-base" data-k="integ-base">
      <span style="font-size:10px; font-weight:bold; opacity:.7; display:block; margin-top:3px;">
        Used to build absolute box-art URLs. Discord must be able to reach it from the
        public internet for embed thumbnails; Home Assistant only needs it on your LAN.</span></label>
    <div class="row" style="margin-top:8px;">
      <button data-act="integ-save" ${S.integDirty ? "" : "disabled"}>SAVE</button>
      <div class="state ${S.integState.indexOf("✔") === 0 ? "ok" : S.integState ? "pend" : ""}">
        ${esc(S.integState || (S.integDirty ? "unsaved changes" : "no pending change"))}</div>
    </div>`);

  return h`<div class="col">${nowPlaying}
    <div class="grid g-half">${discord}${hass}</div>${shared}</div>`;
};

ACTIONS["integ-f"] = (el) => {
  const sec = el.dataset.sec, key = el.dataset.key;
  S.integ.config[sec] = S.integ.config[sec] || {};
  S.integ.config[sec][key] = el.type === "number" ? +el.value : el.value;
  S.integDirty = true; S.integState = "";
};
ACTIONS["integ-t"] = (el) => {
  const sec = el.dataset.sec;
  S.integ.config[sec] = S.integ.config[sec] || {};
  S.integ.config[sec][el.dataset.key] = el.checked;
  S.integDirty = true; S.integState = ""; paint();
};
ACTIONS["integ-base"] = (el) => {
  S.integ.config.public_base_url = el.value;
  S.integDirty = true; S.integState = "";
};
ACTIONS["integ-save"] = async () => {
  S.integState = "saving..."; paint();
  try {
    const r = await api("POST", "/integrations/set", S.integ.config);
    S.integ.config = r.config;
    S.integ.status = r.status;
    S.integDirty = false; S.integState = "✔ saved";
    toast("✔ integrations saved", "ok");
  } catch (e) {
    S.integState = ""; toast("✖ save failed: " + e.message, "err");
  }
  paint();
};
ACTIONS["integ-test"] = (el) => op("test " + el.dataset.which, async () => {
  const r = await api("POST", "/integrations/test/" + el.dataset.which);
  if (r.sent) toast("✔ test message sent to Discord", "ok");
  else if (r.connected) toast("✔ connected to MQTT and announced entities", "ok");
  else toast("✖ " + (r.note || "test failed"), "err");
  S.integ = await api("GET", "/integrations");
  return r;
}, null);

/* ------------------------------------------------------------------ konami */
const KONAMI = ["arrowup", "arrowup", "arrowdown", "arrowdown", "arrowleft",
                "arrowright", "arrowleft", "arrowright", "b", "a"];
addEventListener("keydown", (e) => {
  const k = String(e.key).toLowerCase();
  S.konami = k === KONAMI[S.konami] ? S.konami + 1 : (k === "arrowup" ? 1 : 0);
  if (S.konami < KONAMI.length) return;
  S.konami = 0;
  const p = document.getElementById("party");
  p.querySelector(".nyan").style.backgroundImage = "url(/assets/gifs/nyan_cat_all.gif)";
  p.classList.remove("hide");
  toast("⬆⬆⬇⬇⬅➡⬅➡ B A — nice. have a nyan cat.", "ok");
  setTimeout(() => p.classList.add("hide"), 6500);
});
addEventListener("hashchange", () => {
  const p = location.hash.slice(1);
  if (TAB_KEYS.indexOf(p) >= 0 && p !== S.page) go(p);
});

/* -------------------------------------------------------------------- boot */
paint();
refresh().then(() => loadTab(S.page));
setInterval(refresh, 3000);
// The elapsed counter ticks per second; everything else waits for the poll.
setInterval(() => {
  if (S.page === "dash" && S.ov && (S.ov.cabinet_state || {}).running) paint();
}, 1000);
</script>
</body>
</html>
